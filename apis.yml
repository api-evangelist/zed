aid: zed
name: Zed
description: 'Zed is a BSP-supervised fintech building a premium consumer credit card
  for Southeast Asians, headquartered in Manila with an engineering team in San Francisco.
  Its flagship product is the Zed Card, a Titanium Mastercard with no foreign transaction
  fees, no annual fees, flexible installments, and an accompanying mobile app that
  offers real-time statements, spend notifications, and unlimited self-destructing
  virtual cards for online purchases. The company raised a $16.5M Series A led by Accel
  with participation from Valar Ventures and fintech operators from Nubank, Square,
  and Mercury. Zed is a consumer-facing financial product and does not currently publish
  a public developer API, SDKs, or developer documentation.'
